name: Deploy Pages

# Builds the static site from the current main and publishes it to GitHub
# Pages. Called by deploy.yml (site changes), update-closing-dates.yml and
# update-resort-list.yml (data changes); never runs the data pipeline itself.
on:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          # Data workflows commit to main earlier in the same run; build that,
          # not the commit the run was triggered on.
          ref: main

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Next.js reuses compiled modules from .next/cache, which roughly halves
      # rebuilds when only a few files changed.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'data/**', 'next.config.ts') }}
          restore-keys: |
            nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Build static site
        env:
          NEXT_PUBLIC_BASE_PATH: /indy-nav
        run: npx next build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: out

  # Deploy runs in its own job, as in GitHub's Pages starter workflows.
  # Calling deploy-pages in the same job right after upload-pages-artifact
  # races the artifact service: the upload finalizes, but ListArtifacts can
  # still return 0 a few hundred ms later, and deploy-pages does not retry
  # ("No artifacts named github-pages were found for this workflow run").
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # One Pages deploy at a time. A deploy waiting behind another is replaced
    # by a newer one; every build checks out main, so the newest is complete.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
