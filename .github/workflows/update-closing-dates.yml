name: Update Closing Dates

on:
  schedule:
    # Run daily at 11:00 UTC (6:00 AM ET)
    - cron: "0 11 * * *"
  workflow_dispatch: # Allow manual trigger

# Both data workflows commit to main; run them one at a time so neither
# pushes onto a branch the other just moved.
concurrency:
  group: data-updates
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          # A run that waited in the data-updates queue would otherwise check
          # out the commit it was triggered on, which may be behind main by
          # then, and its push would be rejected.
          ref: main

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run closing dates pipeline
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
        run: npx tsx scripts/fetch-closing-dates.ts

      - name: Cross-check against OnTheSnow
        run: npx tsx scripts/cross-check-closing-dates.ts --fix

      # Pipeline and cross-check write closing-dates.json, onthesnow-map.json,
      # and data/archive/ (at season rollover).
      - name: Check for changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore: update season dates $(date -u +%Y-%m-%d)"
          # main can still move during a long run (e.g. a PR merge); data
          # commits touch only data/, so rebasing onto it is safe.
          git pull --rebase origin main
          git push

  # Deploys on every run, as before, whether or not the data changed.
  deploy:
    needs: update-data
    uses: ./.github/workflows/deploy-pages.yml
