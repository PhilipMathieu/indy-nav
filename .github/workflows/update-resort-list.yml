name: Update Resort List

on:
  schedule:
    # Mondays at 10:00 UTC, an hour before the daily dates run. Indy Pass adds
    # resorts in a few waves a year (Feb, Mar, Sep); weekly is plenty.
    - cron: "0 10 * * 1"
  workflow_dispatch: # Allow manual trigger

# Both data workflows commit to main; run them one at a time so neither
# pushes onto a branch the other just moved.
concurrency:
  group: data-updates
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-resorts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          # A run that waited in the data-updates queue would otherwise check
          # out the commit it was triggered on, which may be behind main by
          # then, and its push would be rejected.
          ref: main

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Scrape resort list from Indy Pass
        run: npx tsx scripts/fetch-resorts.ts

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet data/mountains.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated resort list
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/mountains.json
          git commit -m "chore: update resort list from indyskipass.com $(date -u +%Y-%m-%d)"
          # main can still move during a long run (e.g. a PR merge); data
          # commits touch only data/, so rebasing onto it is safe.
          git pull --rebase origin main
          git push
